name: Verus CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Verus makes rolling releases weekly and needs an exact Rust toolchain and
      # an exact Z3. All three are pinned in rust/toolchain-versions.txt; the cache
      # key is that file, so a deliberate bump invalidates it and nothing else does.
      - name: Cache the pinned Verus toolchain
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: verus-${{ hashFiles('rust/toolchain-versions.txt') }}

      - name: Install the pinned toolchain
        run: ./scripts/setup_verus.sh

      # The specification is generated from Dpss/IntModel.lean. If it has drifted,
      # the Rust below is being verified against something that is no longer the
      # Lean specification -- which is the one failure this whole design exists to
      # prevent. No Lean toolchain needed: the generator reads the source text.
      - name: The generated specification is current
        run: python3 scripts/lean_to_verus.py --check

      # A build can succeed while a proof is stubbed out. Verus reports a count;
      # anything other than "0 errors" fails the step.
      - name: Verify the Rust half
        run: ./rust/verify.sh

      # Belt and braces, mirroring the Lean half: catch a proof hole directly.
      # `assume` and `external_body` in the proof path would silently weaken
      # everything downstream of them.
      - name: No proof holes in the Rust sources
        run: python3 scripts/no_proof_holes.py
