name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Builds the project against the pinned Mathlib. Fails on any error.
      - uses: leanprover/lean-action@v1

      # A build can succeed while a proof is stubbed out with `sorry`.
      # This step asks Lean which axioms each theorem actually depends on and
      # fails if any depends on `sorryAx`. See STATUS.md §6-7.
      - name: Axiom audit (no theorem may depend on sorryAx)
        run: python3 scripts/audit.py

      # Belt and braces: catch a `sorry` in the sources directly. This looks at
      # code only -- a plain grep also matched the doc comment in
      # Synchronization.lean that explains why there is no `sorry`, so the
      # repository's own explanation failed the check looking for one.
      - name: No `sorry` in sources
        run: python3 scripts/no_sorry.py

      # All ten blocks of rust/traces.expected are checked against Lean here
      # rather than in the Verus job, because this is the job with a Lean
      # toolchain. rust/traces.sh checks the same file against the verified
      # binary, so the two meet on it. See STATUS.md §10, S6c and S7.
      - name: The recorded traces agree with Lean
        run: python3 scripts/check_traces.py

      # STATUS.md's generated blocks and GUIDE.md's deep links both claim to
      # describe the code. Both scripts self-check and fail if they no longer do.
      - name: Generated documentation is current
        run: |
          python3 scripts/refresh_status.py
          python3 scripts/refresh_guide_links.py
          git --no-pager diff --stat -- STATUS.md GUIDE.md
          if ! git diff --quiet -- GUIDE.md; then
            echo "::error::GUIDE.md deep links are stale; run scripts/refresh_guide_links.py"
            exit 1
          fi
          echo "documentation is current"
